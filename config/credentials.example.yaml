# Copy this file to config/credentials.yaml and fill it with credentials
# for devices you own or are explicitly authorized to audit.
#
# IMPORTANT:
# - Do not commit real credentials.
# - Plinto never writes passwords to reports or audit logs.
# - Scope entries to target IPs/ports wherever possible.

credentials:
  - label: "Office router known admin credential"
    username: "admin"
    password: "CHANGE_ME"
    auth_type: "auto"   # auto, basic, or digest
    target_ips:
      - "192.168.1.1"
    target_ports:
      - 80
      - 443

  - label: "Lab test router"
    username: "admin"
    password: "CHANGE_ME_TOO"
    auth_type: "auto"
    target_ips:
      - "192.168.1.254"
    target_ports:
      - 80
