    device_type: NAS
    patterns:
      - synology
      - diskstation
      - dsm

  - vendor: QNAP
    device_type: NAS
    patterns:
      - qnap
      - turbo nas
      - qts

  - vendor: HP
    device_type: Printer
    patterns:
      - hp laserjet
      - hewlett-packard
