rules:
  - vendor: TP-Link
    device_type: Router
    patterns:
      - tp-link
      - tplink
      - archer
      - td-w
      - tl-wr
      - userRpm

  - vendor: D-Link
    device_type: Router
    patterns:
      - d-link
      - dlink
      - dir-
      - dsl-
      - HNAP1

  - vendor: NETGEAR
    device_type: Router
    patterns:
      - netgear
      - nighthawk
      - routerlogin

  - vendor: ASUS
    device_type: Router
    patterns:
      - asus
      - asuswrt
      - Main_Login.asp

  - vendor: MikroTik
    device_type: Router
    patterns:
      - mikrotik
      - routeros
      - winbox

  - vendor: OpenWrt
    device_type: Router
    patterns:
      - openwrt
      - luci
      - cgi-bin/luci

  - vendor: Ubiquiti
    device_type: Network Device
    patterns:
      - ubiquiti
      - unifi
      - airmax

  - vendor: Huawei
    device_type: Router
    patterns:
      - huawei
