  - vendor: Node/Express
    device_type: Node Web Service
    patterns:
      - express
      - x-powered-by: express

  - vendor: Grafana
    device_type: Dashboard Service
    patterns:
      - grafana

  - vendor: Portainer
    device_type: Container Admin Panel
    patterns:
      - portainer

  - vendor: Home Assistant
    device_type: IoT Dashboard
    patterns:
      - home assistant
      - hassio

  - vendor: Prometheus
    device_type: Monitoring Service
    patterns:
      - prometheus
      - promhttp
